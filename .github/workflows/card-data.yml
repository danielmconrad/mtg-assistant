# Loads production D1's card data every day: Scryfall's cards and rulings once Scryfall rebuilds its bulk
# files (around 10:00 UTC), Card Kingdom's prices, and the commander pool built from them, writing only
# rows that changed. Run it by hand from the Actions tab too.
name: Card data ingest

on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: card-data-ingest
  cancel-in-progress: false

jobs:
  ingest:
    # Off until infra:apply has created the database and the deploy has applied its migrations.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    env:
      # A D1-only token: it can't deploy code or change anything but the database.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INGEST_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - run: npm ci --ignore-scripts
      - run: node scripts/ingest-card-data.mjs --remote
