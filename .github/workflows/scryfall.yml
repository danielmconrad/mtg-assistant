# Loads Scryfall's card data into production D1 every day, after Scryfall rebuilds its bulk files
# (around 10:00 UTC), writing only rows that changed. Run it by hand from the Actions tab too.
name: Scryfall ingest

on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scryfall-ingest
  cancel-in-progress: false

jobs:
  ingest:
    # Off until setup:accounts has created the database and the deploy has applied its migrations.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    env:
      # A D1-only token: it can't deploy code or change anything but the database.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INGEST_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: npm ci --ignore-scripts
      - run: node scripts/ingest-scryfall.mjs --remote
